services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patient_verify
      POSTGRES_USER: patient_verify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_verify -d patient_verify"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: npm run db:migrate
    environment:
      - DATABASE_URL=postgresql://patient_verify:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/patient_verify
      - DB_SSL_MODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["setup"]
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: patient-verify-backend
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://patient_verify:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/patient_verify
      - DB_SSL_MODE=disable
      - SESSION_COOKIE_SECURE=false
      - ALLOWED_ORIGIN=http://localhost:5174
      - TRUST_PROXY=false
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls same-origin /api; Nginx proxies it to backend:4000.
        VITE_API_URL: /api
    container_name: patient-verify-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped
