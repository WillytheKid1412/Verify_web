services:
  backend:
    build:
      context: ./backend
    container_name: patient-verify-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/app/data
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: patient-verify-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
