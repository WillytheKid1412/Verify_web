x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "4000"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  DB_SSL_MODE: ${DB_SSL_MODE:-verify-full}
  DATABASE_CA_CERT_FILE: /run/secrets/rds-ca.pem
  DB_POOL_MAX: ${DB_POOL_MAX:-5}
  AWS_REGION: ${AWS_REGION:?Set AWS_REGION in .env.production}
  S3_IMAGE_BUCKET: ${S3_IMAGE_BUCKET:?Set S3_IMAGE_BUCKET in .env.production}
  ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?Set ALLOWED_ORIGIN in .env.production}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  VERIFICATION_BATCH_ID: ${VERIFICATION_BATCH_ID:-}

x-backend-runtime: &backend-runtime
  image: ${BACKEND_IMAGE:-patient-verify-backend:latest}
  build:
    context: ./backend
  environment: *backend-environment
  volumes:
    - ${RDS_CA_CERT_FILE:?Set RDS_CA_CERT_FILE in .env.production}:/run/secrets/rds-ca.pem:ro
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *backend-runtime
    command: npm run db:migrate
    profiles: ["setup"]
    restart: "no"

  seed-admin:
    <<: *backend-runtime
    command: npm run seed:admin
    environment:
      <<: *backend-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
    profiles: ["setup"]
    restart: "no"

  backend:
    <<: *backend-runtime
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-patient-verify-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
