services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patient_verify}
      POSTGRES_USER: ${POSTGRES_USER:-patient_verify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env}
    volumes:
      # Keep PostgreSQL data on /mnt/disk4 with this project instead of the
      # Docker root filesystem on /mnt/disk1, which may run out of space.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: patient-verify-backend
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/app/data
      - RAW_ROOT=/app/data/raw
      - QUERY_PATIENT_ID=08002530
      - SAMPLE_DATA_DIR=/app/sample_data
      - TOPK_FILE=/app/retrieval/top20_related_patients.csv
      - LLM_RETRIEVAL_ROOT=${LLM_RETRIEVAL_ROOT:-}
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-patient_verify}
      - PGUSER=${POSTGRES_USER:-patient_verify}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env}
      - LEGACY_USERS_FILE=/app/data/users.json
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Hãy đặt ADMIN_USERNAME trong file .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Hãy đặt ADMIN_PASSWORD trong file .env}
    volumes:
      - backend_data:/app/data
      - ./app/data/raw:/app/data/raw:ro
      - ./backend/src/data/retrieval.json:/app/src/data/retrieval.json:ro
      - ${TOPK_HOST_FILE:-/mnt/disk4/similar_cases_retrieval/data/experiments/patient_fusion/top20_attention_pool_all_patients_v1/top20_related_patients.csv}:/app/retrieval/top20_related_patients.csv:ro
      - ./sample_data:/app/sample_data:ro
      # Khi dùng tiện ích LLM, mount dữ liệu bằng docker-compose.override.yml;
      # xem mục "Xác minh retrieval LLM" trong README.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls same-origin /api; Nginx proxies it to backend:4000.
        VITE_API_URL: /api
    container_name: patient-verify-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
